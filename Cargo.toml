[package]
name = "nanocode-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nanocodexyz/nanocode-ts"
publish = false
autotests = false
autobenches = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false
bench = false

[features]
default = ["agents"]
agents = ["dep:blake3", "dep:nanocode", "dep:nanocode-code-mode", "dep:nanocode-http", "dep:nanocode-sync"]

[dependencies]
nanocode = { path = "../nanocodex/crates/nanocode", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
nanocode-board = { path = "../nanocodex/crates/runtime/board" }
nanocode-code-mode = { path = "../nanocodex/crates/runtime/code-mode", optional = true }
nanocode-durability-core = { path = "../nanocodex/crates/core/durability" }
nanocode-partitions = { path = "../nanocodex/crates/core/partitions" }
nanocode-platform = { path = "../nanocodex/crates/core/platform" }
nanocode-sync = { path = "../nanocodex/crates/core/sync", optional = true }
nanocode-http = { path = "../nanocodex/crates/core/http", optional = true }
nanocode-turnlog = { path = "../nanocodex/crates/core/turnlog" }
blake3 = { version = "1.8.7", default-features = false, features = ["wasm32_simd"], optional = true }
futures-channel = "0.3.31"
futures-executor = "0.3.31"
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = { version = "0.1.44", default-features = false, features = ["max_level_off"] }

[profile.dev]
debug = false
incremental = true

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "off"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.board]
inherits = "wasm"
lto = "fat"

[profile.wasm.package.djs-core]
opt-level = 3

[profile.wasm.package.nanocode-compression]
opt-level = 3

[profile.wasm.package.nanocode-digest]
opt-level = 3
